{# templates/api_keys/generate_key.html #}
{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Generate New API Key</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Key Name</label>
                    <input type="text" id="name" name="name" required 
                           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea id="description" name="description" rows="3"
                              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Scopes</label>
                    <div class="mt-2 space-y-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="scopes[]" value="read" checked class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">Read</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="scopes[]" value="write" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">Write</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" name="scopes[]" value="admin" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">Admin</span>
                        </label>
                    </div>
                </div>
                
                <div>
                    <label for="expires_days" class="block text-sm font-medium text-gray-700">Expires In (days)</label>
                    <select id="expires_days" name="expires_days" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">Never</option>
                        <option value="7">7 days</option>
                        <option value="30">30 days</option>
                        <option value="90">90 days</option>
                        <option value="365">1 year</option>
                    </select>
                </div>
                
                <div class="flex justify-end space-x-3">
                    <a href="{% url 'api_keys:list' %}" 
                       class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">
                        Cancel
                    </a>
                    <button type="submit"
                            class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded">
                        Generate API Key
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
