<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">API Key Manager</h1>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <span class="text-gray-600">Welcome, {{ user.username }}</span>
                        <a href="{% url 'admin:index' %}" class="text-blue-600 hover:text-blue-800">Admin</a>
                    {% else %}
                        <a href="{% url 'admin:login' %}" class="text-blue-600 hover:text-blue-800">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="bg-white shadow-sm mt-8">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">API Key Management System</p>
        </div>
    </footer>
</body>
</html>
